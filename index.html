  <!-- Structured Data: Travel Agency (JSON-LD) -->
  <script type="application/ld+json">

    "@type": "TravelAgency",
    "name": "Voice of Ceylon Travels",
    "url": "https://www.voceylontravels.com/",
    "logo": "https://www.voceylontravels.com/images/secondimage.jpg",
    "description": "Authentic, small-scale journeys through Sri Lanka's living heritage, wild landscapes and generous local spirit.",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "193/Katugastota",
      "addressLocality": "Kandy",
      "addressCountry": "LK"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+94766724916",
      "email": "infovoceylontravels@gmail.com",
      "contactType": "Customer Service",
      "availableLanguage": ["English", "Sinhala"]
    },
    "sameAs": [
      "https://www.facebook.com/voiceofceylontravels",
      "https://www.instagram.com/voiceofceylontravels"
    ],
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Sri Lanka Tour Packages",
      "itemListElement": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "TouristTrip",
            "name": "Roots of Ceylon & Indigenous Heritage",
            "description": "Meet the living heart of the island through ancient cities, sacred sites and a genuine visit with the Vedda community of Dambana.",

          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "TouristTrip",
            "name": "Island Thrills & Mountain Peaks",
            "description": "White-water rivers, cool cloud forests, hidden waterfalls and the unforgettable Ella train journey.",
            "touristType": "Adventure Tourists"
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "TouristTrip",
            "name": "Wild Ceylon: Giants & Predators",
            "description": "Wildlife safari through national parks searching for leopards, elephants, sloth bears and endemic birds.",
            "touristType": "Ecotourists"
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "TouristTrip",
            "name": "Mindful Serenity & Herbal Healing",

        {
          "@type": "Offer",
          "itemOffered": {

            "touristType": "Honeymoon Tourists"
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "TouristTrip",
            "name": "7-Day Legendary Ramayana Trail",
            "description": "Sacred sites, historic temples and breathtaking landscapes linked to King Ravana, Lord Rama and Seetha Devi.",
            "touristType": "Pilgrims"
          }
        }
      ]
    }
  }
  </script>

  <!-- Structured Data: WebSite with SearchAction -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Voice of Ceylon Travels",
    "url": "https://www.voceylontravels.com/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://www.voceylontravels.com/#packages",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
